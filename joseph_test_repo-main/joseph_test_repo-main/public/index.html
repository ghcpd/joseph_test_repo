<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub PR/Issue Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Interactive GitHub PR / Issue Viewer</h1>
    <div class="form-group">
      <label for="repoInput">GitHub Repository URL</label>
      <input type="text" id="repoInput" placeholder="https://github.com/user/repo" aria-describedby="repoHelp">
      <small id="repoHelp">Provide a GitHub repository URL or owner/repo pair.</small>
    </div>

    <div class="form-group">
      <label for="typeSelect">Select data type</label>
      <select id="typeSelect">
        <option value="prs">Pull Requests</option>
        <option value="issues">Issues</option>
      </select>
    </div>

    <button id="fetchBtn">Fetch List</button>

    <div class="form-group">
      <label for="itemSelect">Select item</label>
      <select id="itemSelect" disabled>
        <option value="">-- No data loaded yet --</option>
      </select>
    </div>

    <div id="highlights"></div>

    <section id="detailsPanel" aria-live="polite">
      <h2>Details</h2>
      <div id="detailsContent">Select a pull request or issue to see details.</div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
