<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Explorer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 90%;
            max-width: 960px;
            background-color: #ffffff;
            margin: 24px auto;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-top: 0;
            font-size: 28px;
            color: #1b1f23;
            text-align: center;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
            align-items: end;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #24292f;
        }
        input[type="text"],
        select,
        button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #d1d5da;
            font-size: 14px;
        }
        button {
            background-color: #2ea44f;
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease-in-out;
        }
        button:hover {
            background-color: #2c974b;
        }
        #itemSelect:disabled {
            background-color: #f6f8fa;
            cursor: not-allowed;
        }
        .details {
            border-top: 1px solid #e1e4e8;
            padding-top: 20px;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .detail-header h2 {
            margin: 0;
            font-size: 22px;
            color: #1f6feb;
        }
        .status {
            padding: 4px 12px;
            border-radius: 999px;
            color: #ffffff;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-open {
            background-color: #2ea44f;
        }
        .status-closed {
            background-color: #cf222e;
        }
        .status-merged {
            background-color: #6f42c1;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .detail-item {
            background-color: #f6f8fa;
            border-radius: 8px;
            padding: 12px;
        }
        .detail-item span {
            display: block;
            color: #57606a;
            font-size: 12px;
            margin-bottom: 4px;
        }
        #detailBody {
            white-space: pre-wrap;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 16px;
            background-color: #ffffff;
            color: #24292f;
            max-height: 360px;
            overflow-y: auto;
        }
        .hidden {
            display: none;
        }
        .highlight {
            background-color: #fff5f5;
            border: 1px solid #e55353;
        }
        .loading {
            font-size: 14px;
            color: #57606a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GitHub PR &amp; Issue Explorer</h1>
        <div class="controls">
            <div>
                <label for="repoInput">GitHub Repository URL</label>
                <input type="text" id="repoInput" placeholder="https://github.com/owner/repository" />
            </div>
            <div>
                <label for="dataTypeSelect">Select data type</label>
                <select id="dataTypeSelect">
                    <option value="pulls">Pull Requests</option>
                    <option value="issues">Issues</option>
                </select>
            </div>
            <div>
                <button id="fetchButton">Fetch List</button>
            </div>
            <div>
                <label for="itemSelect">Available items</label>
                <select id="itemSelect" disabled>
                    <option value="">Select an item</option>
                </select>
            </div>
        </div>
        <p id="statusMessage" class="loading hidden"></p>
        <div id="detailPanel" class="details hidden">
            <div class="detail-header">
                <h2 id="detailTitle"></h2>
                <span id="detailStatus" class="status"></span>
            </div>
            <div class="detail-grid">
                <div class="detail-item">
                    <span>Author</span>
                    <strong id="detailAuthor"></strong>
                </div>
                <div class="detail-item">
                    <span>Created</span>
                    <strong id="detailCreated"></strong>
                </div>
                <div class="detail-item">
                    <span>Updated</span>
                    <strong id="detailUpdated"></strong>
                </div>
            </div>
            <div class="detail-item">
                <span>Labels</span>
                <strong id="detailLabels">None</strong>
            </div>
            <div id="detailBody"></div>
        </div>
    </div>
    <script>
        const repoInput = document.getElementById('repoInput');
        const dataTypeSelect = document.getElementById('dataTypeSelect');
        const fetchButton = document.getElementById('fetchButton');
        const itemSelect = document.getElementById('itemSelect');
        const detailPanel = document.getElementById('detailPanel');
        const detailTitle = document.getElementById('detailTitle');
        const detailStatus = document.getElementById('detailStatus');
        const detailAuthor = document.getElementById('detailAuthor');
        const detailCreated = document.getElementById('detailCreated');
        const detailUpdated = document.getElementById('detailUpdated');
        const detailBody = document.getElementById('detailBody');
        const detailLabels = document.getElementById('detailLabels');
        const statusMessage = document.getElementById('statusMessage');

        let currentRepo = '';
        let currentDataType = dataTypeSelect.value;
        let currentItems = [];
        const detailCache = new Map();
        function resetDetailPanel() {
            detailPanel.classList.add('hidden');
            detailBody.textContent = '';
            detailLabels.textContent = 'None';
            if (detailLabels.parentElement) {
                detailLabels.parentElement.classList.remove('highlight');
            }
            itemSelect.innerHTML = '<option value="">Select an item</option>';
            itemSelect.disabled = true;
        }



        dataTypeSelect.addEventListener('change', () => {
            currentDataType = dataTypeSelect.value;
            resetDetailPanel();
        });

        fetchButton.addEventListener('click', () => {
            loadDataForRepo(repoInput.value.trim());
        });

        async function loadDataForRepo(repoUrl) {
            const parsedRepo = parseRepoUrl(repoUrl);
            if (!parsedRepo) {
                alert('Please enter a valid GitHub repository URL in the format https://github.com/<owner>/<repo>.');
                return;
            }
            currentRepo = parsedRepo;
            resetDetailPanel();
            statusMessage.textContent = 'Fetching data from GitHub...';
            statusMessage.classList.remove('hidden');

            try {
                currentItems = await fetchRepositoryData(currentRepo, currentDataType);
                if (!currentItems.length) {
                    statusMessage.textContent = 'No items found for the selected type.';
                    detailPanel.classList.add('hidden');
                    return;
                }
                populateDropdown(currentItems);
                statusMessage.textContent = `${currentItems.length} ${currentDataType === 'pulls' ? 'pull requests' : 'issues'} retrieved.`;
            } catch (error) {
                console.error(error);
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const repoParam = params.get('repo');
            const typeParam = params.get('type');
            if (typeParam && (typeParam === 'pulls' || typeParam === 'issues')) {
                dataTypeSelect.value = typeParam;
                currentDataType = typeParam;
            }
            if (repoParam) {
                const trimmedRepo = repoParam.trim();
                const formatted = trimmedRepo.startsWith('http://') || trimmedRepo.startsWith('https://')
                    ? trimmedRepo
                    : `https://github.com/${trimmedRepo}`;
                repoInput.value = formatted;
                loadDataForRepo(formatted);
            }
        });


                alert(error.message || 'Failed to fetch data from GitHub.');
                statusMessage.textContent = '';
                statusMessage.classList.add('hidden');
            }
        }

        itemSelect.addEventListener('change', async () => {
            const selectedNumber = itemSelect.value;
            if (!selectedNumber) {
                detailPanel.classList.add('hidden');
                return;
            }
            const selectedItem = currentItems.find(item => String(item.number) === selectedNumber);
            if (!selectedItem) {
                detailPanel.classList.add('hidden');
                return;
            }
            statusMessage.textContent = 'Loading details...';
            statusMessage.classList.remove('hidden');
            try {
                const detail = await fetchDetails(currentRepo, currentDataType, selectedItem);
                renderDetail(detail);
                statusMessage.textContent = '';
                statusMessage.classList.add('hidden');
            } catch (error) {
                console.error(error);
                alert(error.message || 'Failed to retrieve details from GitHub.');
            }
        });

        function parseRepoUrl(url) {
            if (!url) {
                return null;
            }
            try {
                const parsed = new URL(url);
                if (parsed.hostname !== 'github.com') {
                    return null;
                }
                const pathParts = parsed.pathname.split('/').filter(Boolean);
                if (pathParts.length < 2) {
                    return null;
                }
                return `${pathParts[0]}/${pathParts[1]}`;
            } catch (error) {
                return null;
            }
        }

        async function fetchRepositoryData(repo, dataType) {
            const perPage = 30;
            const endpoint = dataType === 'pulls'
                ? `https://api.github.com/repos/${repo}/pulls?state=all&per_page=${perPage}`
                : `https://api.github.com/repos/${repo}/issues?state=all&per_page=${perPage}`;

            const response = await fetch(endpoint, {
                headers: {
                    'Accept': 'application/vnd.github+json'
                }
            });

            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error('Repository not found. Please check the repository URL.');
                }
                if (response.status === 403) {
                    throw new Error('GitHub rate limit exceeded. Please wait and try again later.');
                }
                throw new Error('GitHub API request failed.');
            }

            const data = await response.json();
            if (!Array.isArray(data)) {
                return [];
            }

            if (dataType === 'issues') {
                return data.filter(item => !item.pull_request);
            }
            return data;
        }

        function populateDropdown(items) {
            itemSelect.innerHTML = '<option value="">Select an item</option>';
            items.forEach(item => {
                const title = item.title || '(no title)';
                const labels = (item.labels || []).map(label => label.name.toLowerCase());
                const option = document.createElement('option');
                option.value = String(item.number);
                option.textContent = `#${item.number} · ${title}`;
                if (labels.includes('bug')) {
                    option.classList.add('highlight');
                }
                itemSelect.appendChild(option);
            });
            itemSelect.disabled = false;
        }

        async function fetchDetails(repo, dataType, summaryItem) {
            const cacheKey = `${dataType}-${repo}-${summaryItem.number}`;
            if (detailCache.has(cacheKey)) {
                return detailCache.get(cacheKey);
            }

            if (dataType === 'issues') {
                detailCache.set(cacheKey, summaryItem);
                return summaryItem;
            }

            const response = await fetch(`https://api.github.com/repos/${repo}/pulls/${summaryItem.number}`, {
                headers: {
                    'Accept': 'application/vnd.github+json'
                }
            });
            if (!response.ok) {
                throw new Error('Unable to fetch pull request details.');
            }
            const detail = await response.json();
            detailCache.set(cacheKey, detail);
            return detail;
        }

        function renderDetail(detail) {
            detailTitle.textContent = detail.title || '(no title)';
            const author = detail.user ? detail.user.login : 'Unknown';
            detailAuthor.textContent = author;

            const createdDate = detail.created_at ? new Date(detail.created_at) : null;
            const updatedDate = detail.updated_at ? new Date(detail.updated_at) : null;
            detailCreated.textContent = createdDate ? createdDate.toLocaleString() : 'Unknown';
            detailUpdated.textContent = updatedDate ? updatedDate.toLocaleString() : 'Unknown';

            const labels = Array.isArray(detail.labels) ? detail.labels.map(label => label.name) : [];
            if (labels.length) {
                detailLabels.textContent = labels.join(', ');
                if (labels.map(label => label.toLowerCase()).includes('bug')) {
                    detailLabels.parentElement.classList.add('highlight');
                } else {
                    detailLabels.parentElement.classList.remove('highlight');
                }
            } else {
                detailLabels.textContent = 'None';
                detailLabels.parentElement.classList.remove('highlight');
            }

            const bodyContent = detail.body ? detail.body.trim() : '(No description provided)';
            detailBody.textContent = bodyContent;

            let statusClass = 'status-open';
            let statusText = (detail.state || 'open').toUpperCase();
            if (detail.merged_at) {
                statusClass = 'status-merged';
                statusText = 'MERGED';
            } else if ((detail.state || '').toLowerCase() === 'closed') {
                statusClass = 'status-closed';
            } else if ((detail.state || '').toLowerCase() === 'open') {
                statusClass = 'status-open';
            }
            detailStatus.className = `status ${statusClass}`;
            detailStatus.textContent = statusText;

            detailPanel.classList.remove('hidden');
        }
    </script>
</body>
</html>
