<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub PR &amp; Issue Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(120deg, #1f2937 0%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app-container {
      width: min(960px, 100%);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.5);
      border-radius: 20px;
      padding: 28px 32px 36px;
      backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    label {
      font-size: 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: #cbd5f5;
    }

    input[type="text"],
    select {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.65);
      color: inherit;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    button {
      border: none;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #f8fafc;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      height: 100%;
      min-height: 48px;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.3);
    }

    button:disabled {
      cursor: default;
      opacity: 0.65;
      transform: none;
      box-shadow: none;
    }

    .feedback {
      margin: 12px 0;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.35);
      display: none;
    }

    .feedback.error {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(248, 113, 113, 0.5);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 280px) minmax(0, 1fr);
      gap: 24px;
      align-items: stretch;
    }

    .list-panel,
    .detail-panel {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 360px;
    }

    .list-panel select {
      height: 100%;
      min-height: 260px;
    }

    .detail-panel {
      overflow: hidden;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .detail-header h2 {
      margin: 0;
      font-size: 1.3rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(20, 184, 166, 0.16);
      border: 1px solid rgba(45, 212, 191, 0.45);
      color: #5eead4;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status.closed {
      background: rgba(248, 113, 113, 0.16);
      border-color: rgba(248, 113, 113, 0.45);
      color: #fca5a5;
    }

    .status.merged {
      background: rgba(167, 139, 250, 0.2);
      border-color: rgba(167, 139, 250, 0.45);
      color: #ddd6fe;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      font-size: 0.92rem;
      color: #94a3b8;
    }

    .meta span {
      background: rgba(148, 163, 184, 0.08);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .labels {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .label {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .detail-body {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      padding: 16px;
      margin-top: 8px;
      min-height: 180px;
      white-space: pre-wrap;
      overflow-y: auto;
      max-height: 260px;
    }

    .bug-highlight {
      border-color: rgba(248, 113, 113, 0.45);
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.18);
    }

    @media (max-width: 900px) {
      body {
        padding: 18px;
      }

      .app-container {
        padding: 24px;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app-container" role="main">
    <h1>GitHub PR &amp; Issue Viewer</h1>
    <form class="controls" id="controlForm" aria-label="GitHub data selector">
      <label for="repoInput">
        GitHub Repository URL
        <input id="repoInput" type="text" name="repo" placeholder="https://github.com/owner/repo" required>
      </label>
      <label for="dataType">
        Data Type
        <select id="dataType" name="type">
          <option value="pulls">Pull Requests</option>
          <option value="issues">Issues</option>
        </select>
      </label>
      <label class="sr-only" style="opacity:0;height:0;">Submit</label>
      <button type="submit" id="fetchBtn">Fetch Data</button>
    </form>

    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

    <section class="layout" aria-live="polite">
      <aside class="list-panel" aria-label="PR or issue list">
        <h2 style="margin:0 0 8px;font-size:1.1rem;">Available Items</h2>
        <select id="itemSelect" size="10" aria-label="Select item to view details" disabled>
          <option value="">Please fetch data</option>
        </select>
      </aside>

      <section class="detail-panel" aria-live="polite" aria-label="Selected item details">
        <div class="detail-header">
          <h2 id="detailTitle">Select an item to view details</h2>
          <span class="status" id="detailStatus" hidden>status</span>
        </div>
        <div class="meta" id="metaInfo"></div>
        <div class="labels" id="labelContainer"></div>
        <article class="detail-body" id="detailBody">When you select a pull request or issue, its description will appear here.</article>
      </section>
    </section>
  </main>

  <script>
    (function () {
      const repoInput = document.getElementById('repoInput');
      const dataTypeSelect = document.getElementById('dataType');
      const form = document.getElementById('controlForm');
      const feedback = document.getElementById('feedback');
      const itemSelect = document.getElementById('itemSelect');
      const detailTitle = document.getElementById('detailTitle');
      const detailStatus = document.getElementById('detailStatus');
      const metaInfo = document.getElementById('metaInfo');
      const detailBody = document.getElementById('detailBody');
      const labelContainer = document.getElementById('labelContainer');

      const cache = new Map();
      let currentItems = [];

      function showFeedback(message, type = 'info') {
        feedback.textContent = message;
        feedback.classList.remove('error');
        feedback.style.display = message ? 'block' : 'none';
        if (type === 'error') {
          feedback.classList.add('error');
        }
      }

      function extractRepoParts(url) {
        const trimmedUrl = url.trim();
        const pattern = /^https:\/\/github\.com\/([^\s\/]+)\/([^\s\/]+?)(?:\.git)?\/?$/i;
        const match = trimmedUrl.match(pattern);

        if (!match) {
          throw new Error('Invalid GitHub repository URL. Use the format https://github.com/owner/repo');
        }

        return { owner: match[1], repo: match[2] };
      }

      function createCacheKey(owner, repo, type) {
        return `${owner.toLowerCase()}/${repo.toLowerCase()}:${type}`;
      }

      function formatDate(value) {
        if (!value) {
          return 'N/A';
        }
        try {
          return new Intl.DateTimeFormat(undefined, {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }).format(new Date(value));
        } catch (error) {
          return value;
        }
      }

      function buildItemList(type, payload) {
        const isIssue = type === 'issues';
        const filtered = isIssue ? payload.filter(item => !item.pull_request) : payload;

        return filtered.map(item => ({
          id: String(item.id),
          number: item.number,
          title: item.title,
          author: item.user ? item.user.login : 'Unknown',
          state: item.state,
          mergedAt: item.merged_at || null,
          createdAt: item.created_at,
          updatedAt: item.updated_at,
          body: item.body || '(No description provided)',
          labels: Array.isArray(item.labels) ? item.labels.map(label => ({
            id: label.id || `${item.id}-${label.name}`,
            name: label.name,
            color: label.color
          })) : [],
          htmlUrl: item.html_url
        }));
      }

      async function fetchItems(owner, repo, type) {
        const cacheKey = createCacheKey(owner, repo, type);
        if (cache.has(cacheKey)) {
          return cache.get(cacheKey);
        }

        const endpoint = type === 'pulls'
          ? `https://api.github.com/repos/${owner}/${repo}/pulls?state=all&per_page=100`
          : `https://api.github.com/repos/${owner}/${repo}/issues?state=all&per_page=100`;

        const requestOptions = {
          headers: {
            'Accept': 'application/vnd.github+json'
          }
        };

        const response = await fetch(endpoint, requestOptions);
        if (!response.ok) {
          const errorDetails = await response.json().catch(() => null);
          const message = errorDetails && errorDetails.message
            ? errorDetails.message
            : `Unable to fetch ${type === 'pulls' ? 'pull requests' : 'issues'} (${response.status})`;
          throw new Error(message);
        }

        const payload = await response.json();
        const items = buildItemList(type, payload);
        cache.set(cacheKey, items);
        return items;
      }

      function resetDetails() {
        detailTitle.textContent = 'Select an item to view details';
        detailStatus.hidden = true;
        detailBody.textContent = 'When you select a pull request or issue, its description will appear here.';
        metaInfo.innerHTML = '';
        labelContainer.innerHTML = '';
        detailBody.classList.remove('bug-highlight');
      }

      function populateSelect(items) {
        itemSelect.innerHTML = '';
        if (!items.length) {
          itemSelect.disabled = true;
          const emptyOption = document.createElement('option');
          emptyOption.value = '';
          emptyOption.textContent = 'No items found';
          itemSelect.appendChild(emptyOption);
          return;
        }

        itemSelect.disabled = false;
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = `Select a ${dataTypeSelect.value === 'pulls' ? 'pull request' : 'issue'} to view details`;
        placeholder.disabled = true;
        placeholder.selected = true;
        itemSelect.appendChild(placeholder);

        for (const item of items) {
          const option = document.createElement('option');
          option.value = item.id;
          option.textContent = `#${item.number} · ${item.title}`;
          itemSelect.appendChild(option);
        }
      }

      function renderMeta(item) {
        metaInfo.innerHTML = '';
        const fields = [
          { label: 'Author', value: item.author },
          { label: 'Created', value: formatDate(item.createdAt) },
          { label: 'Updated', value: formatDate(item.updatedAt) }
        ];

        fields.forEach(field => {
          const span = document.createElement('span');
          span.innerHTML = `<strong>${field.label}:</strong> ${field.value}`;
          metaInfo.appendChild(span);
        });

        if (item.htmlUrl) {
          const linkSpan = document.createElement('span');
          linkSpan.innerHTML = `<strong>Link:</strong> <a href="${item.htmlUrl}" target="_blank" rel="noopener" style="color:#a5b4fc;">View on GitHub</a>`;
          metaInfo.appendChild(linkSpan);
        }
      }

      function renderLabels(item) {
        labelContainer.innerHTML = '';
        if (!item.labels.length) {
          return;
        }

        item.labels.forEach(label => {
          const chip = document.createElement('span');
          chip.className = 'label';
          chip.textContent = label.name;
          if (label.color) {
            chip.style.backgroundColor = `#${label.color}`;
            chip.style.color = '#0f172a';
          }
          labelContainer.appendChild(chip);
        });
      }

      function renderDetails(item) {
        if (!item) {
          resetDetails();
          return;
        }

        detailTitle.textContent = item.title;
        const statusText = item.state === 'open' ? 'Open' : 'Closed';
        detailStatus.textContent = item.mergedAt ? 'Merged' : statusText;
        detailStatus.classList.toggle('closed', item.state === 'closed' && !item.mergedAt);
        detailStatus.classList.toggle('merged', Boolean(item.mergedAt));
        detailStatus.hidden = false;

        renderMeta(item);
        renderLabels(item);

        detailBody.textContent = item.body;
        const hasBug = item.labels.some(label => label.name.toLowerCase() === 'bug');
        detailBody.classList.toggle('bug-highlight', hasBug);
      }

      async function handleSubmit(event) {
        event.preventDefault();
        resetDetails();
        showFeedback('Fetching data, please wait...');
        const repoUrl = repoInput.value;
        const type = dataTypeSelect.value;

        try {
          const { owner, repo } = extractRepoParts(repoUrl);
          const items = await fetchItems(owner, repo, type);
          currentItems = items;
          if (!items.length) {
            showFeedback(`No ${type === 'pulls' ? 'pull requests' : 'issues'} found for ${owner}/${repo}.`);
          } else {
            showFeedback(`Loaded ${items.length} ${type === 'pulls' ? 'pull requests' : 'issues'} for ${owner}/${repo}.`);
          }
          populateSelect(items);
        } catch (error) {
          currentItems = [];
          populateSelect(currentItems);
          showFeedback(error.message || 'Unexpected error fetching data.', 'error');
        }
      }

      function handleSelection(event) {
        const selectedId = event.target.value;
        const item = currentItems.find(entry => entry.id === selectedId);
        renderDetails(item);
      }

      form.addEventListener('submit', handleSubmit);
      dataTypeSelect.addEventListener('change', () => {
        if (repoInput.value.trim()) {
          form.requestSubmit();
        }
      });
      itemSelect.addEventListener('change', handleSelection);
    })();
  </script>
</body>
</html>
